name: Release Wffl

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      WFFL_SIGN_IDENTITY: ${{ secrets.WFFL_SIGN_IDENTITY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4

      # Without this, a missing secret surfaces as an opaque
      # "SecKeychainItemImport: Unable to decode the provided data" four steps
      # later. Fail immediately and name what is actually missing.
      - name: Check signing secrets are configured
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          missing=()
          for name in WFFL_SIGN_IDENTITY APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD \
                      APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_API_KEY_BASE64; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}. See docs/release-signing.md for setup." >&2
            exit 1
          fi

      - name: Run unit tests
        run: swift test

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/wffl.keychain-db"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          # bundle.sh matches on the exact identity string; confirm it landed
          # rather than letting the build fail with a vaguer message.
          if ! security find-identity -v -p codesigning | grep -Fq "\"$WFFL_SIGN_IDENTITY\""; then
            echo "::error::Imported certificate does not provide identity '$WFFL_SIGN_IDENTITY'. Available:" >&2
            security find-identity -v -p codesigning >&2
            exit 1
          fi

      - name: Build, sign, and package
        env:
          WFFL_APP_PATH: ${{ github.workspace }}/dist/Wffl.app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Support/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Support/Info.plist
          scripts/bundle.sh release

      - name: Notarize and staple
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          notarize() {
            xcrun notarytool submit "$1" \
              --key "$KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
              --wait
          }

          # 1. Notarize and staple the .app, so the ticket travels with the app
          #    once the user drags it out of the disk image.
          ditto -c -k --keepParent dist/Wffl.app "$RUNNER_TEMP/Wffl.zip"
          notarize "$RUNNER_TEMP/Wffl.zip"
          xcrun stapler staple dist/Wffl.app

          # 2. Build the image around the now-stapled app, then notarize the
          #    image *itself*. A ticket for the app is not a ticket for the
          #    .dmg — stapling an unsubmitted image fails with
          #    "CloudKit query … Record not found" (error 65).
          scripts/make-dmg.sh dist/Wffl.app dist/Wffl.dmg
          notarize dist/Wffl.dmg
          xcrun stapler staple dist/Wffl.dmg

          # Prove the shipped artifact is what we think it is before it is
          # attached to a public release.
          xcrun stapler validate dist/Wffl.dmg
          hdiutil verify dist/Wffl.dmg
          spctl -a -vvv -t install dist/Wffl.app

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/Wffl.dmg
