<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wffl: update film (mockup)</title>
<meta name="color-scheme" content="light dark" />
<style>
@font-face { font-family:"Hanken Grotesk"; src:url("fonts/hanken-grotesk.woff2") format("woff2"); font-weight:100 900; }
@font-face { font-family:"Fragment Mono"; src:url("fonts/fragment-mono.woff2") format("woff2"); font-weight:400; }
:root { --sans:"Hanken Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif; --mono:"Fragment Mono",ui-monospace,Menlo,monospace; --serif:ui-serif,"New York","Iowan Old Style",Georgia,serif; }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; background:#050505; overflow:hidden; font:13px/1.35 var(--sans); -webkit-font-smoothing:antialiased; }
/* The film IS the app window: edge to edge, hidden title bar, traffic lights. The mockup letterboxes it to fit the browser. */
#fit { position:fixed; left:50%; top:50%; width:1100px; height:700px; transform-origin:50% 50%; }
#win { position:absolute; inset:0; overflow:hidden; border-radius:12px; background:var(--g); color:var(--body); box-shadow:0 0 0 1px rgba(0,0,0,.4),0 30px 90px rgba(0,0,0,.6); }
#cam { position:absolute; inset:0; transform-origin:0 0; }
.abs { position:absolute; }
.tl { position:absolute; left:14px; top:14px; display:flex; gap:8px; z-index:30; } .tl i { width:12px; height:12px; border-radius:50%; background:#ff5f57; display:block; } .tl i:nth-child(2){ background:#febc2e } .tl i:nth-child(3){ background:#28c840 }
#sb { position:absolute; left:0; top:0; bottom:0; background:var(--raised); }
#hr { position:absolute; top:0; bottom:0; width:1px; background:var(--hair); }
.txt { position:absolute; white-space:nowrap; }
.nav { position:absolute; left:20px; font-size:12.5px; display:flex; align-items:center; gap:9px; height:20px; white-space:nowrap; z-index:2; }
.nav svg { width:16px; height:14px; }
#pill { position:absolute; left:8px; z-index:1; }
.card { position:absolute; background:var(--card); border:1px solid var(--hair); }
.cap11 { font:11px var(--mono); color:var(--sec); }
#subs { position:absolute; left:44px; bottom:40px; width:640px; height:0; z-index:40; pointer-events:none; }
#subs .s { position:absolute; left:0; bottom:0; width:100%; opacity:0; }
#subs h2 { margin:0 0 8px; font:400 36px/1.04 var(--sans); letter-spacing:-.035em; color:var(--ink); }
#subs p { margin:0 0 6px; font:400 16px/1.45 var(--sans); color:var(--body); max-width:60ch; }
#subs p.q { font-size:13px; color:var(--sec); }
#subs .plate { position:absolute; inset:-26px -30px -18px -30px; border-radius:26px; background:color-mix(in srgb,var(--g) 88%,transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid var(--hair); z-index:-1; }
#skip { position:absolute; right:18px; top:12px; z-index:50; font:500 13px var(--sans); color:var(--sec); background:none; border:0; cursor:pointer; padding:7px 12px; border-radius:99px; }
#skip:hover { color:var(--ink); } #skip:focus-visible,#mc button:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
#prog { position:absolute; left:0; bottom:0; height:2px; background:var(--ink); width:0; z-index:50; opacity:.8; }
#mc { position:fixed; left:50%; transform:translateX(-50%); bottom:8px; z-index:90; display:flex; gap:6px; align-items:center; padding:6px 8px; border-radius:16px; background:rgba(30,30,30,.92); color:#eee; font:12px var(--mono); }
#mc button { all:unset; cursor:pointer; padding:5px 9px; border-radius:99px; background:rgba(255,255,255,.12); } #mc button[aria-pressed="true"]{ background:#F2F2F0; color:#0B0B0B; }
#mc input { width:240px; } #mc .u { opacity:.6; } #tt { min-width:90px; text-align:center; }
</style>
</head>
<body>
<div id="fit"><div id="win">
  <div id="cam">
    <aside id="sb"></aside><div id="hr"></div>
    <div id="sbInner"></div>
    <div id="main"></div>
    <div id="band"></div>
  </div>
  <div class="tl" aria-hidden="true"><i></i><i></i><i></i></div>
  <div id="subs" role="status" aria-live="polite"></div>
  <button id="skip">Skip</button>
  <div id="prog"></div>
</div></div>
<div id="mc" role="group" aria-label="Mockup controls (not part of the design)">
  <span class="u">mockup</span><button id="bPlay">Pause</button><input id="scrub" type="range" min="0" max="32" step="0.01" value="0" aria-label="Scrub film"><span id="tt">0.0 / 32.0 s</span>
  <button id="bTheme">Dark</button><button id="bRm" aria-pressed="false">Reduced motion</button><button id="bSz" aria-pressed="false">900×560</button>
</div>
<script>
/* ======================= FILM TIMELINE (seconds) =======================
   0.0–3.0   OLD app, real old Home, slow push-in
   3.2–7.2   old → new: skin cools, mark stroke → eight bars, layout settles (camera dives on the mark 3.2–4.6, holds, pulls back 5.6–7.2)
   7.6–10.8  caption 2 holds on the new Home
   11.4–14.4 nav: selection pill glides Home → Meetings, view cross-dissolves (camera 10.6–14.4)
   14.6–17.2 caption 3 holds
   17.6–25.2 BAPS Whisper: everything recedes, signal travels to the engine label
   25.6–31.6 pull back, back to Home, "Here on your Mac."
   32.0      captions off; the last frame IS the real new Home, so the film simply stops covering the live app
*/
const DUR = 32;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)); const E={io:t=>.5-.5*Math.cos(Math.PI*t), out:t=>1-Math.pow(1-t,2.6), lin:t=>t};
const seg=(t,a,b,e=E.io)=>e(clamp((t-a)/(b-a))); const L=(a,b,k)=>a+(b-a)*k;
const hex=h=>[h>>16&255,h>>8&255,h&255]; const mixc=(a,b,k)=>{const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(L(v,B[i],k))).join(',')})`;};
const $=s=>document.querySelector(s);
let dark=false, small=false, RM=false;
/* palettes: OLD = git 06579e8 Support/Theme.swift ; NEW = Support/Theme.swift */
const OLD={g:0xF7F3EC,raised:0xEFE9DE,card:0xFFFEFB,ink:0x2C261C,body:0x4A4235,sec:0x8F8676,hair:0xE9E5DC,acc:0x7A9169,onacc:0xFFFEFB,soft:0xE4E3D6};
const NEWL={g:0xF2F2F0,raised:0xE9E9E6,card:0xFFFFFF,ink:0x0B0B0B,body:0x2B2B29,sec:0x6B6B67,hair:0xD2D2CE,acc:0x0B0B0B,onacc:0xFFFFFF,soft:0xE1E1DE};
const NEWD={g:0x0F0F0F,raised:0x0A0A0A,card:0x181818,ink:0xF2F2F0,body:0xD7D7D3,sec:0xAAAAA5,hair:0x383838,acc:0xF2F2F0,onacc:0x0B0B0B,soft:0x303030};
const NAV=['Home','Dashboard','Meetings','Audio Files'];
const ICON='<svg viewBox="0 0 16 14"><rect x="1.5" y="2" width="13" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>';

const SUBS=[
 {a:.8,b:3.0,h:'Wffl, as you knew it.',p:[]},
 {a:4.2,b:10.8,h:'A quieter Wffl.',p:['A calmer monochrome workspace. The same recordings, notes and preferences, with more room for the words that matter.']},
 {a:11.8,b:17.2,h:'More room for your work.',p:['Home, Dashboard, Meetings, Audio Files and Settings now share one consistent workspace. Everything stays where you left it.']},
 {a:18.0,b:25.0,h:'Meet BAPS Whisper.',p:['BAPS Whisper transcribes English, including Gujarati and Sanskrit vocabulary in Latin letters. Optional model, about 1.6 GB; download in Settings.'],q:'For other languages or translation, choose Whisper.'},
 {a:26.2,b:31.4,h:'Here on your Mac.',p:['Audio, transcription and your library stay local. Model downloads use the network; remote summaries are optional.']}];
$('#subs').innerHTML=SUBS.map(s=>`<div class="s"><div class="plate"></div><h2>${s.h}</h2>${s.p.map(x=>`<p>${x}</p>`).join('')}${s.q?`<p class="q">${s.q}</p>`:''}</div>`).join('');
const subEls=[...document.querySelectorAll('#subs .s')];

const H8=[30,20,10,20,26,20,10,30], BX=[16,26,36,46,56,66,76,86];
const sy=x=>{const P=[[12,18],[32,62],[50,34],[68,62],[88,18]];for(let i=0;i<4;i++){const[a,b]=[P[i],P[i+1]];if(x>=a[0]&&x<=b[0])return a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0]);}return 40;};
function markSVG(id){return `<svg id="${id}" class="abs" viewBox="0 0 100 78" style="overflow:visible"><path class="st" d="M12 18 L32 62 L50 34 L68 62 L88 18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>${BX.map(x=>`<ellipse class="b" cx="${x}" cy="${sy(x)}" rx="3.4" ry="2.2"/>`).join('')}</svg>`;}
$('#sbInner').innerHTML=`<div id="pill"></div>
 ${markSVG('mkS')}<span id="wmO" class="txt" style="font:400 17px var(--serif)">Wffl</span><span id="wmN" class="txt" style="font:500 21px var(--sans)">Wffl</span>
 ${NAV.map((n,i)=>`<div class="nav" data-i="${i}">${ICON}<span>${n}</span></div>`).join('')}
 <div id="mlist" class="abs"></div>
 <div class="nav" id="navSet" data-i="4">${ICON}<span>Settings</span></div>
 <div id="noteO" class="abs" style="font-size:10px"></div><div id="noteN" class="abs" style="font-size:10px"></div>`;
$('#mlist').innerHTML=`<div class="abs" style="left:0;width:100%;top:0;height:1px" id="mlHr"></div>`+['Weekly product sync|Today','Design review|Yesterday','Interview notes|Mon'].map(x=>{const[a,b]=x.split('|');return `<div class="abs ml" style="left:20px;font-size:12px;white-space:nowrap"><div class="mt">${a}</div><div class="cap11">${b}</div></div>`;}).join('');
$('#main').innerHTML=`
 <div id="oldHome"><div class="txt" id="bc" style="font-size:11px">Home</div><div class="abs" id="bcHr" style="height:1px;top:37px;left:0;right:0"></div>
   <div class="txt" id="subO" style="font-size:13px;text-align:center;line-height:1.5;white-space:normal">Record a meeting and Wffl transcribes and summarizes it —<br>entirely on this Mac.</div>
   <div id="chips" class="abs"></div></div>
 <div id="newHome"><div class="txt" id="subN" style="font:400 16px var(--sans)">Record the conversation. Find the words and decisions later.</div><div id="ready" class="abs"></div></div>
 ${markSVG('mkH')}
 <div class="txt" id="hO" style="font:400 38px var(--serif)">Ready when you are.</div>
 <div class="txt" id="hN" style="font:300 52px/58px var(--sans);letter-spacing:-2px">Ready when<br>you are.</div>
 <div id="bStart" class="abs"></div><div id="bImp" class="abs"></div>
 <div id="meet"></div>`;
$('#chips').innerHTML=['BAPS Whisper ready','Local AI Connected'].map((x,i)=>`<div class="abs chip" data-i="${i}" style="font-size:11px;white-space:nowrap"><span class="dot"></span>${x}</div>`).join('');
$('#ready').innerHTML=`<div class="txt" style="left:20px;top:0;font:300 26px var(--sans)">Your setup</div>`+[['Transcription','BAPS Whisper','Ready'],['Summary service','Local summary service','Configured'],['Microphone','Allowed','Local capture'],['System audio','Allowed','Local capture']].map((r,i)=>`<div class="abs rr" style="left:20px;top:${52+i*66}px"><div class="cap11">${r[0]}</div><div style="font-size:13px;font-weight:500">${r[1]}</div><div style="font-size:11px" class="cap11b">${r[2]}</div></div>`).join('')+`<div class="txt" style="left:20px;top:330px;font:500 13px var(--sans)" id="adv">Open advanced settings ↗</div>`;
$('#meet').innerHTML=`<div class="txt" id="mTitle" style="font:300 34px var(--sans);letter-spacing:-1px">Weekly product sync</div><div class="txt cap11" id="mMeta">Sample · illustrative</div>
 <div class="card" id="mT" style="border-radius:20px"><div class="cap11" style="position:absolute;left:18px;top:14px">TRANSCRIPT</div>
  <div class="mr" style="top:44px"><span class="cap11">00:41 · Me</span><div style="font-size:15px;margin-top:3px">We begin with <u>kirtan</u>, then the <u>satsang</u> talk.</div></div>
  <div class="mr rec" style="top:104px"><span class="cap11">00:49 · Speaker 1</span><div style="font-size:15px;margin-top:3px">Can we keep the notes in one place?</div></div>
  <div class="mr rec" style="top:164px"><span class="cap11">00:58 · Me</span><div style="font-size:15px;margin-top:3px">Yes, they stay on this Mac.</div></div></div>
 <div class="card" id="mS" style="border-radius:20px"><div class="cap11" style="position:absolute;left:18px;top:14px">SUMMARY</div><div style="position:absolute;left:18px;top:44px;font:300 22px/1.15 var(--sans);letter-spacing:-.5px;width:230px">Keep notes in one place.</div><div style="position:absolute;left:18px;top:112px;font-size:12px;width:230px" class="cap11b">Everything stays in the local library.</div></div>`;
$('#band').innerHTML=`<div id="eng" class="abs"><svg viewBox="0 0 12 12" width="13" height="13" style="flex:none"><path d="M6 1.5v6M3.4 5.4 6 8l2.6-2.6M2 10.5h8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>BAPS Whisper · ≈1.6 GB · Optional model</span></div>${markSVG('mkG')}`;

const P=(el,o)=>{ for(const k in o) el.style[k]=(typeof o[k]==='number'&&k!=='opacity'&&k!=='zIndex')?o[k]+'px':o[k]; };
function paintMark(svg,m,col,sz,x,y,op,strokeCol){
  svg.style.width=sz+'px'; svg.style.height=sz*.78+'px'; svg.style.left=x+'px'; svg.style.top=y+'px'; svg.style.opacity=op;
  const st=svg.querySelector('.st'); st.setAttribute('stroke',strokeCol||col); st.setAttribute('stroke-width',9); st.style.opacity=1-seg(m,0,.4,E.lin);
  svg.querySelectorAll('.b').forEach((b,i)=>{ const a=seg(m,.15+i*.05,.75+i*.03,E.io); b.setAttribute('cy',L(sy(BX[i]),39,a)); b.setAttribute('ry',L(2.2,H8[i]*.72,a)); b.setAttribute('fill',col); b.style.opacity=seg(m,.1,.3,E.lin); });
}

function render(t){
  const k=seg(t,3.4,6.6), p=seg(t,4.6,6.8), mm=seg(t,3.6,5.8,E.lin), x=seg(t,5.0,6.2,E.lin);
  const NEW=dark?NEWD:NEWL;
  const c={}; for(const key in OLD) c[key]=mixc(OLD[key],NEW[key],k);
  const st=$('#win').style;
  st.setProperty('--g',c.g); st.setProperty('--raised',c.raised); st.setProperty('--card',c.card); st.setProperty('--ink',c.ink); st.setProperty('--body',c.body); st.setProperty('--sec',c.sec); st.setProperty('--hair',c.hair);
  const toMeet=seg(t,11.4,13.0), backHome=seg(t,26.0,27.4);
  const meet=clamp(toMeet-backHome);
  const sbw=L(210,220,p);
  P($('#sb'),{width:sbw}); P($('#hr'),{left:sbw});
  /* camera keyframes: [t, scale, focusX, focusY] in window units */
  const cam=[[0,1,550,350],[3.0,1.03,550,350],[3.2,1.03,550,350],[4.6,1.9,655,178],[5.6,1.9,655,178],[7.2,1,550,350],[10.6,1,550,350],[12.2,1.25,330,260],[13.2,1.25,330,260],[14.4,1,550,350],[17.4,1,550,350],[19.2,1.32,640,430],[24.4,1.32,640,430],[26.0,1,550,350],[99,1,550,350]];
  let s=1,fx=550,fy=350; for(let i=0;i<cam.length-1;i++){const a=cam[i],b=cam[i+1]; if(t>=a[0]&&t<=b[0]){const q=E.io(clamp((t-a[0])/(b[0]-a[0]))); s=L(a[1],b[1],q); fx=L(a[2],b[2],q); fy=L(a[3],b[3],q);} }
  if(t<3.0) s=L(1,1.03,seg(t,0,3.0,E.lin));
  $('#cam').style.transform=`translate(${550-fx*s}px,${350-fy*s}px) scale(${s})`;
  const rc=seg(t,18.4,19.6)*(1-seg(t,24.4,25.4));       // recede amount during BAPS
  const dimK=1-.86*rc;
  /* sidebar: one set of elements, interpolated old → new */
  const wmY=L(48,52,p), markS=L(16,24,p);
  paintMark($('#mkS'),mm,c.ink,markS,16,wmY-markS*.39,(1-seg(t,17.6,18.4))+seg(t,24.4,25.6),'#2C261C');
  const wl=L(40,49,p); P($('#wmO'),{left:wl,top:wmY-11,opacity:1-seg(k,.15,.7)}); $('#wmO').style.color=c.ink;
  P($('#wmN'),{left:wl,top:wmY-13,opacity:seg(k,.15,.7)}); $('#wmN').style.color=c.ink;
  const step=L(29,35,p), rowH=L(27,33,p), row0=L(73,78,p);
  const sel=2*E.io(toMeet)-2*E.io(backHome);
  document.querySelectorAll('#sbInner .nav[data-i]:not(#navSet)').forEach(n=>{ const i=+n.dataset.i; const on=Math.abs(i-sel)<.55; P(n,{top:row0+i*step+rowH/2-10,opacity:dimK}); n.style.color=on?mixc(OLD.ink,NEW.onacc,k):c.body; n.style.fontWeight=on?500:400; });
  const pl=$('#pill'); P(pl,{top:row0+sel*step,height:rowH,width:sbw-16,borderRadius:L(7,999,seg(k,.2,.8)),opacity:dimK}); pl.style.background=mixc(OLD.soft,NEW.acc,k); pl.style.border='1px solid '+mixc(0xCBD1BD,NEW.acc,k);
  const sn=$('#navSet'); P(sn,{top:L(611,619,p)+rowH/2-10,opacity:dimK}); sn.style.color=c.body;
  const ml=$('#mlist'); P(ml,{left:0,top:row0+3*step+rowH+10,width:sbw,opacity:meet*dimK}); $('#mlHr').style.background=c.hair;
  ml.querySelectorAll('.ml').forEach((e,i)=>{P(e,{top:12+i*44}); e.querySelector('.mt').style.color=i===0?c.ink:c.body;});
  const nO=$('#noteO'),nN=$('#noteN');
  P(nO,{left:8,top:646,width:sbw-16,height:46,padding:10,opacity:1-seg(k,.2,.6),borderRadius:8,background:'rgba(228,227,214,.6)'}); nO.textContent='On-device only · nothing leaves this Mac'; nO.style.color=c.sec;
  P(nN,{left:8,top:660,width:sbw-16,height:32,padding:10,opacity:seg(k,.4,.8)*dimK,borderRadius:13,background:c.card}); nN.textContent='Local summary service'; nN.style.color=c.sec;
  /* detail area */
  const dx0=sbw+1, dW=1100-dx0; $('#main').style.cssText=`position:absolute;left:${dx0}px;top:0;width:${dW}px;height:700px`;
  const homeOp=1-meet;
  $('#oldHome').style.opacity=(1-x)*homeOp;
  P($('#bc'),{left:20,top:12}); $('#bc').style.color=c.sec; $('#bcHr').style.background=c.hair;
  const cx=dW/2; P($('#subO'),{left:cx-200,top:279,width:400}); $('#subO').style.color=c.sec;
  $('#chips').querySelectorAll('.chip').forEach((e,i)=>{P(e,{left:cx-(i?-8:156),top:452,padding:'5px 10px'}); e.style.color=c.sec;e.querySelector('.dot').style.cssText=`display:inline-block;width:9px;height:9px;border-radius:50%;background:${c.ink};margin-right:6px`;});
  $('#newHome').style.opacity=x*homeOp; P($('#subN'),{left:32,top:267}); $('#subN').style.color=c.body;
  P($('#ready'),{left:dW-32-275,top:38,width:275,height:360}); $('#ready').style.borderLeft=`1px solid ${c.hair}`;
  $('#ready').querySelectorAll('.cap11,.cap11b').forEach(e=>e.style.color=c.sec); $('#ready').querySelectorAll('.rr').forEach(e=>e.style.color=c.ink); $('#ready').firstElementChild.style.color=c.ink; $('#adv').style.color=c.ink;
  paintMark($('#mkH'),mm,c.ink,L(44,66,p),L(cx-22,32,p),L(156,42.5,p),homeOp,'#2C261C');
  P($('#hO'),{left:cx-123,top:L(218,132,p),opacity:(1-x)*homeOp}); $('#hO').style.color=c.ink;
  P($('#hN'),{left:32,top:132,opacity:x*homeOp}); $('#hN').style.color=c.ink;
  const bs=$('#bStart'), bw=L(166,168,p), bh=L(41,38,p);
  P(bs,{left:L(cx-bw/2,32,p),top:L(344,310,p),width:bw,height:bh,borderRadius:L(11,999,p),background:mixc(OLD.acc,NEW.acc,k),color:mixc(OLD.onacc,NEW.onacc,k),display:'flex',alignItems:'center',justifyContent:'center',opacity:homeOp,font:'600 14px var(--sans)',boxShadow:`0 3px 10px rgba(122,145,105,${.35*(1-p)})`}); bs.textContent='● Start Recording';
  const bi=$('#bImp'); P(bi,{left:L(cx-60,32+bw+10,p),top:L(396,310,p),width:L(120,150,p),height:L(32,38,p),borderRadius:L(9,999,p),background:mixc(OLD.card,NEW.g,k),border:`1px solid ${c.hair}`,color:c.body,display:'flex',alignItems:'center',justifyContent:'center',opacity:homeOp,font:'500 12px var(--sans)'}); bi.textContent=x<.5?'↥ Import audio':'↥ Import Audio';
  /* Meetings view (stand-in for the real MeetingsPage) */
  const mv=$('#meet'); mv.style.opacity=meet;
  P($('#mTitle'),{left:32,top:30}); $('#mTitle').style.color=c.ink; P($('#mMeta'),{left:32,top:76}); $('#mMeta').style.color=c.sec;
  const tw=Math.min(520,dW-64-300);
  P($('#mT'),{left:32,top:116,width:tw,height:316}); P($('#mS'),{left:32+tw+16,top:116,width:270,height:200,opacity:dimK});
  mv.querySelectorAll('.mr').forEach(e=>{e.style.cssText+=`;position:absolute;left:18px;right:18px;border-top:1px solid ${c.hair};padding-top:10px;color:${c.ink}`; });
  mv.querySelectorAll('.rec').forEach(e=>{e.style.opacity=dimK; e.style.filter=rc>.01?`blur(${rc}px)`:'';});
  $('#mS').style.filter=rc>.01?`blur(${rc}px)`:''; mv.querySelectorAll('.cap11,.cap11b').forEach(e=>e.style.color=c.sec); $('#mS').style.color=c.ink;
  /* engine label + travelling signal */
  const band=$('#band'); band.style.cssText=`position:absolute;left:${dx0}px;top:0;width:${dW}px;height:700px;pointer-events:none`;
  const trav=seg(t,17.8,19.4)*(1-seg(t,24.6,26.0)); const eng=$('#eng'), ey=462;
  P(eng,{left:32+104,top:ey,height:38,padding:'0 16px',display:'flex',alignItems:'center',gap:8,borderRadius:999,background:c.card,border:`1px solid ${c.hair}`,color:c.ink,font:'11px var(--mono)',whiteSpace:'nowrap',opacity:seg(t,19.0,19.9,E.out)*(1-seg(t,24.6,25.2))});
  const sx0=16-dx0, sy0=wmY-markS*.39; const gx=L(sx0,32,trav), gy=L(sy0,ey+4,trav), gs=L(24,72,trav);
  paintMark($('#mkG'),1,c.ink,gs,gx,gy,trav>.001?1:0,'');
  /* captions */
  subEls.forEach((e,i)=>{ const S=SUBS[i]; const o=seg(t,S.a,S.a+.7,E.out)*(1-seg(t,S.b-.5,S.b)); e.style.opacity=o; e.style.transform=`translateY(${(1-o)*10}px)`; });
  $('#subs').querySelectorAll('.plate').forEach(e=>{});
  $('#skip').style.opacity=1-seg(t,31.2,31.8); $('#skip').style.pointerEvents=t>31.6?'none':'';
  $('#prog').style.width=(t/DUR*100)+'%';
}

let T=0, playing=true, last=0;
function tick(now){ if(playing&&!RM){ const dt=Math.min(.1,(now-last)/1000); T=Math.min(DUR,T+dt); if(T>=DUR){playing=false;$('#bPlay').textContent='Replay';} } last=now; render(T); $('#scrub').value=T; $('#tt').textContent=T.toFixed(1)+' / '+DUR+'.0 s'; requestAnimationFrame(tick); }
function fit(){ const w=small?900:1100,h=small?560:700; const k=Math.min(innerWidth/w,(innerHeight-46)/h); const f=$('#fit'); f.style.width=w+'px'; f.style.height=h+'px'; f.style.marginLeft=-(w/2)+'px'; f.style.marginTop=-(h/2)-16+'px'; f.style.transform=`scale(${Math.min(k,1.6)})`; }
$('#bPlay').onclick=()=>{ if(T>=DUR){T=0;} playing=!playing; $('#bPlay').textContent=playing?'Pause':'Play'; };
$('#scrub').oninput=e=>{ T=+e.target.value; playing=false; $('#bPlay').textContent='Play'; };
$('#bTheme').onclick=()=>{ dark=!dark; $('#bTheme').textContent=dark?'Light':'Dark'; };
$('#bRm').onclick=()=>{ RM=!RM; $('#bRm').setAttribute('aria-pressed',RM); if(RM){ T=7.4; playing=false; } else { T=0; playing=true; } };
$('#bSz').onclick=()=>{ small=!small; $('#bSz').setAttribute('aria-pressed',small); fit(); };
$('#skip').onclick=()=>{ T=DUR; playing=false; $('#bPlay').textContent='Replay'; };
addEventListener('keydown',e=>{ if(e.key==='Escape'){ T=DUR; playing=false; } if(e.key===' '){ e.preventDefault(); $('#bPlay').click(); } });
addEventListener('resize',fit); fit();
const qs=new URLSearchParams(location.search); if(qs.get('theme')==='dark'){dark=true;$('#bTheme').textContent='Light';} if(qs.get('t')){T=+qs.get('t');playing=false;$('#bPlay').textContent='Play';}
window.__seek=t=>{T=t;playing=false;render(t);}; document.fonts.ready.then(()=>requestAnimationFrame(tick));
</script>
