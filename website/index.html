<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Wffl is a private, native macOS meeting assistant." />
    <title>Wffl for macOS</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1d1d1f; background: #f8f5ef; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; box-sizing: border-box; }
      main { max-width: 720px; text-align: center; }
      .mark { width: 64px; height: 64px; margin: 0 auto 1.5rem; border-radius: 20px; display: grid; place-items: center; background: #1d1d1f; color: #f8f5ef; font-size: 1.75rem; font-weight: 800; }
      h1 { font-size: clamp(3rem, 10vw, 5.5rem); letter-spacing: -0.07em; margin: 0; }
      p { font-size: 1.2rem; line-height: 1.55; color: #5e5b55; max-width: 560px; margin: 1.25rem auto 2rem; }
      a { display: inline-block; background: #e85d3f; color: white; border-radius: 999px; padding: 1rem 1.45rem; text-decoration: none; font-weight: 700; box-shadow: 0 8px 20px #e85d3f44; }
      small { display: block; margin-top: 1.25rem; color: #76716a; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">W</div>
      <h1>Meetings, kept private.</h1>
      <p>Wffl records, transcribes, and summarizes your meetings locally on your Mac. No account. No cloud required.</p>
      <a href="https://github.com/PurvarajG/Wffl/releases/latest/download/Wffl.dmg">Download for macOS</a>
      <small>Requires macOS 15 or later. The link always downloads the latest stable release.</small>
    </main>
  </body>
</html>
